name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13.0', '24']
        typescript: ['5.9.3', '6.0.3']
        eslint: ['10.4.0', '10.12.0']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:consumer
        env:
          TEST_TYPESCRIPT_VERSION: ${{ matrix.typescript }}
          TEST_ESLINT_VERSION: ${{ matrix.eslint }}
